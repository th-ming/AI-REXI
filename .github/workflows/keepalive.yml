name: keepalive
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake REXI backend
        run: curl -fsS -o /dev/null -m 90 -w "HTTP %{http_code} in %{time_total}s\n" https://ai-rexi-backend.onrender.com/api/health
