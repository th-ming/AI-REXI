# AI REXI — Render blueprint (web service duy nhất; backend tự serve Frontend/dist)
# TÁCH HOÀN TOÀN khỏi project/service PKTY — không dùng chung repo, DB, env.
services:
  - type: web
    name: ai-rexi-backend
    runtime: node
    plan: free
    rootDir: Backend
    branch: main
    healthCheckPath: /api/health
    # Binary cho tính năng nặng: python3+yt-dlp (YouTube), ffmpeg (video), chromium headless
    # (browser tools). Mọi bước phụ || echo để KHÔNG làm gãy build nếu apt/nix chặn.
    buildCommand: >-
      npm install && cd ../Frontend && npm install && npm run build && cd ../Backend &&
      (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends python3 python3-pip ffmpeg || echo "[build] apt skipped");
      (python3 -m pip install --no-cache-dir --break-system-packages yt-dlp || pip3 install --no-cache-dir --user yt-dlp || echo "[build] yt-dlp skipped");
      (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 npx playwright install chromium || echo "[build] chromium skipped")
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgresql
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # BẮT BUỘC: auth.middleware THROW khi production không có JWT_SECRET → backend không khởi động được
      - key: JWT_SECRET
        sync: false
      # BẮT BUỘC (prod): mã hoá API key trong DB (32 bytes hex). PHẢI TRÙNG GIÁ TRỊ LOCAL
      # để 12 key đã encrypt trong khoa_api giải mã chạy ngay sau migrate (không nhập lại).
      - key: ENC_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Admin seed (thay cho file admin-seed.js chỉ có trên máy local)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Agent nội bộ (ReAct qua chat API — không cần opencode.exe/dsh trên server)
      - key: AGENT_PROVIDER
        value: bai
      - key: AGENT_MODEL
        value: qwen3.8-flash
