<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Pac-Man</title>
    <link rel="shortcut icon" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #0d0e11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        h1 {
            color: #f5d442;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        canvas {
            display: block;
            background: #000;
            border-radius: 12px;
            max-width: 96vw;
            max-height: calc(96vh - 60px);
        }
        p.hint {
            margin-top: 10px;
            font-size: 13px;
            color: #8a91a3;
        }
    </style>
</head>
<body>
    <h1>Pac-Man</h1>
    <canvas id="canvas" width="960" height="640">Trình duyệt không hỗ trợ canvas</canvas>
    <p class="hint">Nhấn [Space] để tạm dừng hoặc tiếp tục</p>
    <script src="./static/script/game.js"></script>
    <script src="./static/script/index.js"></script>
</body>
</html>
